name: reusable-deploy-vps-backend

on:
  workflow_call:
    inputs:
      app-name:
        description: App name used for app dir (/root/<app-name>) and PM2 process name
        required: true
        type: string
      source:
        description: Files/folders to copy from repo
        required: false
        type: string
        default: Backend/**,ecosystem.config.js
    secrets:
      VPS_HOST:
        required: true
      VPS_USERNAME:
        required: true
      VPS_SSH_KEY:
        required: true
      BACKEND_ENV_FILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /root/${{ inputs.app-name }}
      BACKEND_DIR: /root/${{ inputs.app-name }}/Backend
      PM2_APP_NAME: ${{ inputs.app-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare VPS directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ env.APP_DIR }}"
            mkdir -p "${{ env.BACKEND_DIR }}"

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "${{ inputs.source }}"
          target: "${{ env.APP_DIR }}"
          strip_components: 0

        - name: Verify backend directory and files on VPS
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USERNAME }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              set -e
              echo "--- Directory structure at ${{ env.APP_DIR }} ---"
              ls -l "${{ env.APP_DIR }}"
              echo "--- Directory structure at ${{ env.BACKEND_DIR }} ---"
              ls -l "${{ env.BACKEND_DIR }}"
              if [ ! -f "${{ env.BACKEND_DIR }}/server.js" ]; then
                echo "[ERROR] server.js not found in ${{ env.BACKEND_DIR }}."
                exit 1
              fi
              if [ ! -f "${{ env.BACKEND_DIR }}/.env" ]; then
                echo "[ERROR] .env not found in ${{ env.BACKEND_DIR }}."
                exit 1
              fi

      - name: Write backend .env from single secret
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BACKEND_ENV_FILE
          script: |
            set -e
            if [ -z "$BACKEND_ENV_FILE" ]; then
              echo "BACKEND_ENV_FILE secret is empty or missing."
              exit 1
            fi
            mkdir -p "${{ env.BACKEND_DIR }}"
            printf "%s\n" "$BACKEND_ENV_FILE" > "${{ env.BACKEND_DIR }}/.env"
            chmod 600 "${{ env.BACKEND_DIR }}/.env"

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is not installed on VPS. Install Node.js first."
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            cd "${{ env.BACKEND_DIR }}"
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            if pm2 describe "${{ env.PM2_APP_NAME }}" >/dev/null 2>&1; then
              pm2 restart "${{ env.PM2_APP_NAME }}" --update-env
            else
              if [ -f "${{ env.APP_DIR }}/ecosystem.config.js" ]; then
                cd "${{ env.APP_DIR }}"
                pm2 start ecosystem.config.js --only "${{ env.PM2_APP_NAME }}"
              else
                pm2 start server.js --name "${{ env.PM2_APP_NAME }}" --cwd "${{ env.BACKEND_DIR }}" --update-env
              fi
            fi
            pm2 save
            pm2 status
