name: reusable-deploy-vps-backend

on:
  workflow_call:
    inputs:
      app-name:
        description: App name used for app dir (/root/<app-name>) and PM2 process name
        required: true
        type: string
      source:
        description: Files/folders to copy from repo
        required: false
        type: string
        default: Backend/**,ecosystem.config.js
    secrets:
      VPS_HOST:
        required: true
      VPS_USERNAME:
        required: true
      VPS_SSH_KEY:
        required: true
      BACKEND_ENV_FILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /root/${{ inputs.app-name }}
      BACKEND_DIR: /root/${{ inputs.app-name }}/Backend
      PM2_APP_NAME: ${{ inputs.app-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare VPS directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ env.APP_DIR }}"
            mkdir -p "${{ env.BACKEND_DIR }}"

      - name: Copy backend files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "${{ inputs.source }}"
          target: "${{ env.APP_DIR }}"
          strip_components: 0

      - name: Verify backend directory and files on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- Directory structure at ${{ env.APP_DIR }} ---"
            ls -la "${{ env.APP_DIR }}"
            echo "--- Directory structure at ${{ env.BACKEND_DIR }} ---"
            ls -la "${{ env.BACKEND_DIR }}"
            if [ ! -f "${{ env.BACKEND_DIR }}/server.js" ]; then
              echo "[ERROR] server.js not found in ${{ env.BACKEND_DIR }}."
              exit 1
            fi

      - name: Write backend .env from single secret
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BACKEND_ENV_FILE
          script: |
            set -e
            if [ -z "$BACKEND_ENV_FILE" ]; then
              echo "BACKEND_ENV_FILE secret is empty or missing."
              exit 1
            fi
            mkdir -p "${{ env.BACKEND_DIR }}"
            printf "%s\n" "$BACKEND_ENV_FILE" > "${{ env.BACKEND_DIR }}/.env"
            chmod 600 "${{ env.BACKEND_DIR }}/.env"
            if [ ! -s "${{ env.BACKEND_DIR }}/.env" ]; then
              echo "[ERROR] .env file was not written correctly."
              exit 1
            fi

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is not installed on VPS. Install Node.js first."
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            cd "${{ env.BACKEND_DIR }}"
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            RESOLVED_PM2_APP_NAME="${{ env.PM2_APP_NAME }}"
            if [ -f "${{ env.APP_DIR }}/ecosystem.config.js" ]; then
              ECOSYSTEM_PM2_APP_NAME="$(node -e "try{const cfg=require(process.argv[1]);const apps=Array.isArray(cfg.apps)?cfg.apps:[cfg.apps];const name=(apps[0]&&apps[0].name)||'';process.stdout.write(name)}catch(e){process.stdout.write('')}" "${{ env.APP_DIR }}/ecosystem.config.js")"
              if [ -n "$ECOSYSTEM_PM2_APP_NAME" ]; then
                RESOLVED_PM2_APP_NAME="$ECOSYSTEM_PM2_APP_NAME"
              fi
            fi

            echo "PM2 app name target: ${RESOLVED_PM2_APP_NAME}"

            if pm2 describe "$RESOLVED_PM2_APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$RESOLVED_PM2_APP_NAME" --update-env
            else
              if [ -f "${{ env.APP_DIR }}/ecosystem.config.js" ]; then
                cd "${{ env.APP_DIR }}"
                if ! pm2 start ecosystem.config.js --only "$RESOLVED_PM2_APP_NAME" --update-env; then
                  pm2 start ecosystem.config.js --update-env
                fi
              else
                pm2 start server.js --name "$RESOLVED_PM2_APP_NAME" --cwd "${{ env.BACKEND_DIR }}" --update-env
              fi
            fi

            if ! pm2 describe "$RESOLVED_PM2_APP_NAME" >/dev/null 2>&1; then
              echo "[ERROR] PM2 process ${RESOLVED_PM2_APP_NAME} is not running after deploy."
              pm2 status
              exit 1
            fi

            printf "%s\n" "$RESOLVED_PM2_APP_NAME" > "${{ env.APP_DIR }}/.active_pm2_name"
            pm2 save
            pm2 status

      - name: Verify backend API health on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            ACTIVE_PM2_APP_NAME="${{ env.PM2_APP_NAME }}"
            if [ -f "${{ env.APP_DIR }}/.active_pm2_name" ]; then
              ACTIVE_PM2_APP_NAME="$(tr -d '\r\n' < "${{ env.APP_DIR }}/.active_pm2_name")"
            fi

            PORT_VALUE="$(grep -E '^PORT=' "${{ env.BACKEND_DIR }}/.env" | tail -n1 | cut -d'=' -f2- | tr -d '"' | tr -d "'" | tr -d '[:space:]')"
            if [ -z "$PORT_VALUE" ]; then
              PORT_VALUE=3000
            fi

            API_URL="http://127.0.0.1:${PORT_VALUE}/"
            echo "Checking API health at ${API_URL}"

            if ! command -v curl >/dev/null 2>&1; then
              echo "[WARN] curl is not installed on VPS; skipping HTTP health check."
              exit 0
            fi

            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 "$API_URL" >/dev/null; then
                echo "API is healthy at ${API_URL}"
                exit 0
              fi
              echo "Attempt ${i}/20: API not ready yet, retrying..."
              sleep 2
            done

            echo "[ERROR] API health check failed at ${API_URL}"
            pm2 status
            pm2 logs "$ACTIVE_PM2_APP_NAME" --lines 80 --nostream || true
            exit 1

      - name: Add deploy success markdown summary
        if: ${{ success() }}
        run: |
          {
            echo "## Backend Deploy Pipeline Worked"
            echo ""
            echo "- Status: success"
            echo "- App input: ${{ inputs.app-name }}"
            echo "- Backend directory: ${{ env.BACKEND_DIR }}"
            echo "- Marker: backend pipeline worked and API health check passed"
            echo "- Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
