name: reusable-react-build

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for application build
        type: string
        default: '20'
      build-folder:
        description: Build output folder
        type: string
        default: 'dist'
      artifact-name:
        description: Name of the uploaded artifact
        type: string
        default: 'react-build'
    secrets:
      FRONTEND_ENV_FILE:
        description: Full multiline frontend env file content written to .env.production during CI build
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Inject frontend env file
        run: |
          if [ -n "${{ secrets.FRONTEND_ENV_FILE }}" ]; then
            printf "%s\n" "${{ secrets.FRONTEND_ENV_FILE }}" > .env.production
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.build-folder }}
